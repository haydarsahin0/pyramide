<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pyramide Göttingen — Sticker, Edition 01</title>
  <meta name="description" content="Ein einziger Sticker, gestaltet in Göttingen. 6 €, persönliche Abholung im SUB Café.">
  <meta name="theme-color" content="#F6F1E7">
  <meta property="og:title" content="Pyramide Göttingen">
  <meta property="og:description" content="Ein Sticker. Ein Termin. Fertig. — 6 €, Abholung im SUB Café, Göttingen.">
  <meta property="og:image" content="https://haydarsahin0.github.io/pyramide/assets/img/og.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="preview-banner" id="previewBanner" hidden><span data-i18n="preview.banner"></span></div>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#" data-go="shop" aria-label="Pyramide Göttingen">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 3.9a1.4 1.4 0 0 0-2.4 0L2.4 18.6A1.4 1.4 0 0 0 3.6 20.7h16.8a1.4 1.4 0 0 0 1.2-2.1Z"/></svg>
        <span class="brand-name">Pyramide</span><span class="brand-city">Göttingen</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="#sticker" data-scroll data-i18n="nav.sticker"></a>
        <a href="#how" data-scroll data-i18n="nav.how"></a>
        <a href="#pickup" data-scroll data-i18n="nav.pickup"></a>
      </nav>
      <div class="nav-right">
        <button class="nav-book" type="button" data-open-lookup data-i18n="nav.book"></button>
        <div class="lang" role="group" data-i18n-aria="nav.lang">
          <button type="button" class="lang-btn" data-lang="de" aria-label="Deutsch">
            <img src="assets/img/flag-de.svg" alt="" width="18" height="18"><span>DE</span>
          </button>
          <button type="button" class="lang-btn" data-lang="en" aria-label="English">
            <img src="assets/img/flag-gb.svg" alt="" width="18" height="18"><span>EN</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ───────────── SHOP ───────────── -->
    <div class="view" data-view="shop">
      <section class="hero" id="sticker">
        <p class="eyebrow reveal" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-title reveal" data-i18n-html="hero.title"></h1>
        <p class="hero-sub reveal" data-i18n="hero.sub"></p>
        <div class="hero-actions reveal">
          <button class="btn btn-primary btn-lg" type="button" data-buy>
            <span data-i18n="hero.buy"></span><span class="btn-sep" aria-hidden="true"></span><span data-price></span>
          </button>
          <a class="btn-link" href="#how" data-scroll><span data-i18n="hero.how"></span> <span aria-hidden="true">›</span></a>
        </div>

        <div class="stage reveal">
          <div class="stage-glow" aria-hidden="true"></div>
          <div class="tilt" id="tilt">
            <img class="sticker" src="assets/img/sticker.svg" width="520" height="520" data-i18n-alt="img.alt" alt="">
          </div>
          <div class="stage-shadow" aria-hidden="true"></div>
        </div>
        <p class="hero-note reveal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span data-i18n="hero.note"></span>
        </p>
      </section>

      <section class="section features">
        <h2 class="section-title reveal" data-i18n-html="feat.title"></h2>
        <div class="feature-grid">
          <article class="feature reveal">
            <svg class="feature-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M17.6 6.6a1.8 1.8 0 0 0-3.2 0L4.9 23.4a1.8 1.8 0 0 0 1.6 2.7h19a1.8 1.8 0 0 0 1.6-2.7Z"/></svg>
            <h3 data-i18n="feat.1.t"></h3>
            <p data-i18n="feat.1.d"></p>
          </article>
          <article class="feature reveal">
            <svg class="feature-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="14" width="18" height="13" rx="3"/><path d="M11 14v-3a5 5 0 0 1 10 0v3"/></svg>
            <h3 data-i18n="feat.2.t"></h3>
            <p data-i18n="feat.2.d"></p>
          </article>
          <article class="feature reveal">
            <svg class="feature-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="5"/><path d="M6.5 27a9.5 9.5 0 0 1 19 0"/></svg>
            <h3 data-i18n="feat.3.t"></h3>
            <p data-i18n="feat.3.d"></p>
          </article>
        </div>
      </section>

      <section class="section how" id="how">
        <p class="eyebrow reveal" data-i18n="how.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="how.title"></h2>
        <ol class="steps">
          <li class="step reveal"><span class="step-no">01</span><h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p></li>
          <li class="step reveal"><span class="step-no">02</span><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p></li>
          <li class="step reveal"><span class="step-no">03</span><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p></li>
          <li class="step reveal"><span class="step-no">04</span><h3 data-i18n="how.4.t"></h3><p data-i18n="how.4.d"></p></li>
        </ol>
      </section>

      <section class="section pickup" id="pickup">
        <div class="pickup-card reveal">
          <div class="pickup-text">
            <p class="eyebrow" data-i18n="pickup.eyebrow"></p>
            <h2 class="section-title" data-i18n-html="pickup.title"></h2>
            <p class="pickup-sub" data-i18n="pickup.sub"></p>
            <a class="btn-link" data-maps target="_blank" rel="noopener"><span data-i18n="pickup.map"></span> <span aria-hidden="true">↗</span></a>
          </div>
          <dl class="pickup-facts">
            <div><dt data-i18n="pickup.hours.k"></dt><dd data-i18n="pickup.hours.v"></dd></div>
            <div><dt data-i18n="pickup.slot.k"></dt><dd data-i18n="pickup.slot.v"></dd></div>
            <div><dt data-i18n="pickup.addr.k"></dt><dd data-address></dd></div>
          </dl>
        </div>
      </section>

      <section class="section faq">
        <h2 class="section-title reveal" data-i18n="faq.title"></h2>
        <div class="faq-list reveal">
          <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
          <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
          <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
          <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
        </div>
      </section>

      <section class="section cta">
        <img class="cta-sticker reveal" src="assets/img/sticker.svg" width="140" height="140" alt="" aria-hidden="true">
        <h2 class="section-title reveal" data-i18n="cta.title"></h2>
        <p class="cta-sub reveal" data-i18n="cta.sub"></p>
        <div class="reveal">
          <button class="btn btn-primary btn-lg" type="button" data-buy>
            <span data-i18n="hero.buy"></span><span class="btn-sep" aria-hidden="true"></span><span data-price></span>
          </button>
        </div>
      </section>
    </div>

    <!-- ───────────── ORDER NUMBER ───────────── -->
    <div class="view flow" data-view="order" hidden>
      <section class="flow-inner narrow">
        <div class="check-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
        <p class="eyebrow" data-i18n="order.eyebrow"></p>
        <h1 class="flow-title" data-i18n-html="order.title"></h1>

        <div class="order-card" id="orderCard">
          <span class="order-label" data-i18n="order.label"></span>
          <output class="order-no" id="orderNo">PYR-——————</output>
          <div class="order-actions">
            <button class="btn btn-soft" type="button" id="copyOrder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
              <span data-i18n="order.copy"></span>
            </button>
            <button class="btn btn-soft" type="button" id="saveOrder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>
              <span data-i18n="order.save"></span>
            </button>
          </div>
        </div>
        <p class="demo-note" id="orderDemo" hidden data-i18n="order.demo"></p>

        <div class="notice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg>
          <div><strong data-i18n="order.warn.t"></strong><p data-i18n="order.warn.d"></p></div>
        </div>

        <label class="ack">
          <input type="checkbox" id="ack">
          <span class="ack-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>
          <span data-i18n="order.ack"></span>
        </label>

        <button class="btn btn-primary btn-lg btn-block" type="button" id="toBooking" disabled data-i18n="order.next"></button>
      </section>
    </div>

    <!-- ───────────── BOOKING ───────────── -->
    <div class="view flow" data-view="book" hidden>
      <section class="flow-inner">
        <p class="eyebrow" data-i18n="book.eyebrow"></p>
        <h1 class="flow-title" data-i18n="book.title"></h1>
        <p class="flow-sub" data-i18n="book.sub"></p>

        <div class="order-chip">
          <span data-i18n="book.order"></span>
          <strong id="bookOrderNo"></strong>
          <button type="button" class="chip-link" data-open-lookup data-i18n="book.change"></button>
        </div>

        <div class="notice notice-soft" id="existingNotice" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
          <p id="existingText"></p>
        </div>

        <div class="booking">
          <div class="calendar card">
            <div class="cal-head">
              <span class="cal-month" id="calMonth"></span>
              <div class="cal-arrows">
                <button type="button" class="icon-btn" id="dayPrev" aria-label="‹"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
                <button type="button" class="icon-btn" id="dayNext" aria-label="›"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
              </div>
            </div>
            <div class="days" id="days" role="listbox"></div>
            <div class="times-head">
              <span data-i18n="book.times"></span>
              <span class="times-status" id="timesStatus"></span>
            </div>
            <div class="times" id="times" role="listbox"></div>
          </div>

          <form class="details card" id="bookForm" novalidate>
            <h2 class="details-title" data-i18n="book.details"></h2>
            <div class="summary" id="summary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
              <span id="summaryText" data-i18n="book.pick"></span>
            </div>
            <label class="field">
              <span data-i18n="book.name"></span>
              <input type="text" id="fName" autocomplete="name" maxlength="80" required data-i18n-placeholder="book.name.ph">
            </label>
            <label class="field">
              <span><span data-i18n="book.email"></span> <em data-i18n="book.email.opt"></em></span>
              <input type="email" id="fEmail" autocomplete="email" maxlength="120" data-i18n-placeholder="book.email.ph">
            </label>
            <p class="form-error" id="formError" role="alert" hidden></p>
            <button class="btn btn-primary btn-lg btn-block" type="submit" id="confirmBtn" disabled>
              <span data-i18n="book.confirm"></span>
            </button>
          </form>
        </div>
      </section>
    </div>

    <!-- ───────────── CONFIRMED ───────────── -->
    <div class="view flow" data-view="done" hidden>
      <section class="flow-inner narrow">
        <div class="check-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
        <p class="eyebrow" data-i18n="done.eyebrow"></p>
        <h1 class="flow-title" id="doneTitle"></h1>
        <p class="flow-sub" data-i18n="done.sub"></p>

        <dl class="ticket">
          <div><dt data-i18n="done.date"></dt><dd id="doneDate"></dd></div>
          <div><dt data-i18n="done.time"></dt><dd id="doneTime"></dd></div>
          <div><dt data-i18n="done.place"></dt><dd id="donePlace"></dd></div>
          <div><dt data-i18n="done.order"></dt><dd id="doneOrder" class="mono"></dd></div>
        </dl>

        <div class="done-actions">
          <button class="btn btn-primary btn-lg" type="button" id="icsBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
            <span data-i18n="done.ics"></span>
          </button>
          <a class="btn btn-soft btn-lg" data-maps target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span data-i18n="done.map"></span>
          </a>
        </div>
        <div class="done-links">
          <button type="button" class="btn-link" id="rescheduleBtn" data-i18n="done.reschedule"></button>
          <button type="button" class="btn-link" data-go="shop" data-i18n="done.home"></button>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 3.9a1.4 1.4 0 0 0-2.4 0L2.4 18.6A1.4 1.4 0 0 0 3.6 20.7h16.8a1.4 1.4 0 0 0 1.2-2.1Z"/></svg>
        <span>Pyramide Göttingen</span>
      </div>
      <p class="footer-meta"><span data-i18n="footer.made"></span> <span class="dot">·</span> <span data-i18n="footer.pay"></span> <span class="dot">·</span> © <span id="year"></span></p>
    </div>
  </footer>

  <!-- order lookup -->
  <dialog class="sheet" id="lookup">
    <form method="dialog" class="sheet-inner" id="lookupForm" novalidate>
      <h2 data-i18n="lookup.title"></h2>
      <p class="sheet-sub" data-i18n="lookup.sub"></p>
      <input class="order-input" id="lookupInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" data-i18n-placeholder="lookup.ph">
      <p class="form-error" id="lookupError" role="alert" hidden data-i18n="lookup.err"></p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" id="lookupCancel" data-i18n="lookup.cancel"></button>
        <button class="btn btn-primary" type="submit" data-i18n="lookup.go"></button>
      </div>
      <p class="sheet-foot"><span data-i18n="lookup.none"></span> <button type="button" class="btn-link" id="lookupBuy" data-i18n="lookup.buy"></button></p>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
