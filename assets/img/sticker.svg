<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Pyramide sticker">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DFA8"/>
      <stop offset="1" stop-color="#E9BE72"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A253"/>
      <stop offset="1" stop-color="#C98E40"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F29C8E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F29C8E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5B4325" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5B4325" flood-opacity=".12"/>
    </filter>
    <clipPath id="clip">
      <path d="M216.6,91.6 Q200,62 183.4,91.6 L70.6,292.4 Q54,322 88.0,322.0 L312.0,322.0 Q346,322 329.4,292.4 Z"/>
    </clipPath>
  </defs>

  <!-- die-cut sticker border -->
  <path filter="url(#shadow)" fill="#FFFDF8" stroke="#FFFDF8" stroke-width="44" stroke-linejoin="round"
        d="M216.6,91.6 Q200,62 183.4,91.6 L70.6,292.4 Q54,322 88.0,322.0 L312.0,322.0 Q346,322 329.4,292.4 Z"/>

  <!-- body -->
  <path fill="url(#body)" d="M216.6,91.6 Q200,62 183.4,91.6 L70.6,292.4 Q54,322 88.0,322.0 L312.0,322.0 Q346,322 329.4,292.4 Z"/>
  <g clip-path="url(#clip)">
    <path d="M200,62 L272,330 L360,330 Z" fill="url(#side)" opacity=".55"/>
    <path d="M200,62 L272,330" stroke="#C48A3E" stroke-opacity=".35" stroke-width="2"/>
    <!-- soft highlight on the left face -->
    <path d="M190,92 Q178,112 120,215" stroke="#FFF6DE" stroke-opacity=".75" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="128" cy="262" rx="24" ry="15" fill="url(#blush)"/>
  <ellipse cx="243" cy="262" rx="24" ry="15" fill="url(#blush)"/>

  <!-- eyes -->
  <g fill="#2A1F15">
    <ellipse cx="153" cy="232" rx="13" ry="17"/>
    <ellipse cx="219" cy="232" rx="13" ry="17"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="158" cy="224" r="5.2"/>
    <circle cx="224" cy="224" r="5.2"/>
    <circle cx="149" cy="240" r="2.2" opacity=".8"/>
    <circle cx="215" cy="240" r="2.2" opacity=".8"/>
  </g>

  <!-- smile -->
  <path d="M175,258 Q186,270 197,258" fill="none" stroke="#2A1F15" stroke-width="5" stroke-linecap="round"/>

  <!-- tiny sparkle -->
  <path fill="#E2B064" d="M302,92 q3,14 17,17 q-14,3 -17,17 q-3,-14 -17,-17 q14,-3 17,-17 Z"/>
  <circle cx="330" cy="140" r="4" fill="#E9C58A"/>
</svg>
